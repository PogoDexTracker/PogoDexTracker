<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PogoDex Tracker</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg-deep:#0A1420;
    --bg-panel:#0F1E2E;
    --bg-panel-2:#142A3D;
    --line:#20394D;
    --accent:#7C93B0;
    --accent-dim:#45566A;
    --red:#FF4B4B;
    --gold:#FFCE45;
    --text:#EAF6F0;
    --text-dim:#84A2B0;
    --good:#4ADE80;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, #17273a 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #14212e 0%, transparent 55%),
      var(--bg-deep);
    color:var(--text);
    font-family:'Roboto',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Roboto',sans-serif;font-weight:700;}
  .mono{font-family:'Roboto Mono',monospace;}
  #app{max-width:1200px;margin:0 auto;padding:20px 16px 60px;}

  .bezel{
    background:linear-gradient(160deg,var(--bg-panel),var(--bg-panel-2));
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:relative;
  }
  .bezel::before{
    content:"";
    position:absolute;inset:0;
    border-radius:20px;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2764%27%20height%3D%2764%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cpath%20fill%3D%27%23A9C2D6%27%20fill-opacity%3D%270.06%27%20d%3D%27M34%204%20L14%2034%20L26%2034%20L10%2060%20L40%2028%20L26%2028%20L38%204%20Z%27/%3E%3C/svg%3E");
    background-size:64px 64px;
    pointer-events:none;
  }
  .bezel-title{display:flex;align-items:center;gap:12px;}
  .power-dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,75,75,0.2);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .brand-logo{width:64px;height:64px;border-radius:50%;flex-shrink:0;}
  .signin-logo{width:130px;height:130px;margin:0 auto 14px;display:block;}
  .bezel-title h1{margin:0;font-size:24px;letter-spacing:.3px;}
  .bezel-sub{color:var(--text-dim);font-size:13px;margin-top:2px;}
  .stat-pill{
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 16px;
    font-size:13px;
    color:var(--text-dim);
  }
  .discord-btn{
    display:flex;align-items:center;gap:7px;
    background:#5865F2;color:#fff;
    padding:8px 16px;border-radius:999px;
    text-decoration:none;font-size:13px;font-weight:700;
    transition:.15s;
  }
  .discord-btn:hover{background:#4752C4;}
  .stat-pill b{color:var(--gold);font-family:'Roboto Mono',monospace;}
  .profile-chip{display:flex;align-items:center;gap:8px;position:relative;cursor:pointer;padding:6px 10px;border-radius:10px;transition:.15s;}
  .profile-chip:hover{background:var(--bg-deep);}
  .profile-chip img{width:28px;height:28px;border-radius:50%;}
  .chip-caret{color:var(--text-dim);font-size:11px;}
  .account-menu{
    display:none;
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px;
    min-width:150px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    z-index:20;
  }
  .account-menu.open{display:flex;flex-direction:column;gap:2px;}
  .account-menu button{
    background:none;
    border:none;
    color:var(--text);
    text-align:left;
    padding:9px 12px;
    border-radius:8px;
    font-family:'Roboto',sans-serif;
    font-size:14px;
    cursor:pointer;
  }
  .account-menu button:hover{background:var(--bg-deep);}

  .tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap;}
  .tab-btn{
    background:var(--bg-panel);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:10px 18px;
    border-radius:12px;
    font-family:'Roboto',sans-serif;font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:.15s;
  }
  .tab-btn:hover{color:var(--text);border-color:var(--accent-dim);}
  .tab-btn.active{background:var(--accent);color:var(--bg-deep);border-color:var(--accent);font-weight:700;}
  .tab-btn:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }

  .search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  input[type=text], input[type=number]{
    background:var(--bg-deep);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 14px;
    border-radius:10px;
    font-family:'Roboto',sans-serif;
    font-size:14px;
  }
  input[type=text]{flex:1;min-width:180px;}

  select{
    background:var(--bg-deep);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 14px;
    border-radius:10px;
    font-family:'Roboto',sans-serif;
    font-size:14px;
    cursor:pointer;
  }

  .dex-grid{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .dex-cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:12px;
    padding-top:10px;
  }
  .region-section{padding-bottom:4px;}
  .region-card{
    width:100%;display:flex;align-items:center;gap:14px;
    border:none;border-radius:18px;padding:16px 18px;margin-bottom:4px;
    cursor:pointer;position:relative;overflow:hidden;text-align:left;
    font-family:'Roboto',sans-serif;
  }
  .region-card::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 100%);
  }
  .region-card-starters{display:flex;flex-shrink:0;position:relative;z-index:1;}
  .region-card-starters img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));margin-left:-14px;}
  .region-card-starters img:first-child{margin-left:0;}
  .region-card-info{flex:1;position:relative;z-index:1;min-width:0;}
  .region-card-name{font-size:17px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.5);letter-spacing:.3px;}
  .region-card-fraction{font-size:13px;color:rgba(255,255,255,0.85);margin-top:2px;}
  .region-card-complete{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#fff;margin-top:2px;}
  .region-pokeball{width:14px;height:14px;border-radius:50%;background:linear-gradient(#fff 50%,#eee 50%);border:2px solid #222;position:relative;flex-shrink:0;}
  .region-pokeball::before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:#222;}
  .region-pokeball::after{content:"";position:absolute;top:4px;left:4px;width:4px;height:4px;background:#fff;border:1.5px solid #222;border-radius:50%;}
  .region-card-chevron{position:relative;z-index:1;color:rgba(255,255,255,0.8);font-size:14px;flex-shrink:0;}

  .dex-card.picked{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset;}
  .picked-badge{font-size:9px;color:var(--good);margin-top:2px;font-weight:700;}
  .region-toggle{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    background:none;
    border:none;
    color:var(--text);
    cursor:pointer;
    padding:10px 4px;
    font-family:'Roboto',sans-serif;
  }
  .region-toggle:hover .region-title{color:var(--accent);}
  .region-chevron{color:var(--accent);font-size:13px;width:14px;text-align:center;}
  .region-title{font-weight:700;font-size:15px;transition:.15s;}
  .region-count{color:var(--text-dim);font-size:12px;margin-left:auto;}
  .dex-card{
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;
    text-align:center;
    transition:.15s;
    position:relative;
  }
  .dex-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .dex-card.unreleased{opacity:0.45;}
  .dex-card.unreleased:hover{opacity:0.7;}
  .unreleased-badge{font-size:9px;color:var(--text-dim);margin-top:2px;}
  .dex-card img{width:72px;height:72px;object-fit:contain;}
  .dex-num{color:var(--text-dim);font-size:11px;}
  .dex-name{font-size:13px;font-weight:700;text-transform:capitalize;margin-top:2px;}
  .quick-toggles{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:2;}
  .qt-btn{
    width:22px;height:22px;border-radius:50%;
    border:1px solid var(--line);
    background:var(--bg-panel);
    color:var(--text-dim);
    font-size:12px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;line-height:1;
    transition:.15s;
  }
  .qt-btn:hover{border-color:var(--accent);color:var(--text);}
  .qt-btn.active{background:var(--good);border-color:var(--good);color:var(--bg-deep);}
  .qt-btn.shiny.active{background:var(--gold);border-color:var(--gold);color:var(--bg-deep);}
  .dex-card-body{cursor:default;}


  .overlay{position:fixed;inset:0;background:rgba(5,10,25,0.75);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .overlay.show{display:flex;}
  .modal{background:var(--bg-panel);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:22px;position:relative;}
  .modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;}
  .modal-hero{text-align:center;}
  .modal-hero img{width:150px;height:150px;object-fit:contain;}
  .modal-num{color:var(--text-dim);font-family:'Roboto Mono',monospace;}
  .modal-name{font-size:22px;text-transform:capitalize;}
  .go-status-note{font-size:12px;color:var(--text-dim);margin-top:4px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);}
  .toggle-row label{font-size:14px;color:var(--text-dim);}
  .switch{position:relative;width:44px;height:24px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:24px;transition:.15s;}
  .slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:white;border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--accent);}
  input:checked + .slider::before{transform:translateX(20px);}
  .qty-input{width:70px;text-align:center;}
  .qty-input-mini{width:44px;text-align:center;padding:4px;font-size:12px;}
  .view-variations-btn{
    width:100%;
    background:none;
    border:none;
    border-top:1px solid var(--line);
    color:var(--text-dim);
    font-size:11px;
    padding:6px 0 0;
    margin-top:6px;
    cursor:pointer;
    font-family:'Roboto',sans-serif;
  }
  .view-variations-btn:hover{color:var(--accent);}
  .variations-panel{
    grid-column:1/-1;
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin:-4px 0 4px;
  }
  .var-trade-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .var-trade-label{font-size:12px;color:var(--text-dim);}
  .form-toggle-row{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;}
  .forms-section{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
  .form-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .form-item img{width:48px;height:48px;object-fit:contain;}
  .form-item .fname{flex:1;font-size:13px;text-transform:capitalize;}
  .mini-toggle{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-dim);}
  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:14px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .inv-list{display:flex;flex-direction:column;gap:8px;}
  .inv-row{display:flex;align-items:center;gap:12px;background:var(--bg-deep);border:1px solid var(--line);border-radius:10px;padding:8px 12px;}
  .inv-row img{width:44px;height:44px;object-fit:contain;}
  .inv-row .name{flex:1;text-transform:capitalize;font-size:14px;}
  .inv-row .tag{font-size:11px;color:var(--gold);background:rgba(255,206,69,0.12);padding:2px 8px;border-radius:999px;}

  .trade-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .trade-cols > div:first-child{border-right:1px solid var(--line);padding-right:16px;}
  @media(max-width:760px){
    .trade-cols{grid-template-columns:1fr;}
    .trade-cols > div:first-child{border-right:none;padding-right:0;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:4px;}
    .dex-card img{width:56px;height:56px;}
  }
  .trade-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;margin-top:10px;}
  .trade-item{display:flex;align-items:center;gap:8px;background:var(--bg-deep);border:1px solid var(--line);border-radius:8px;padding:6px 10px;}
  .trade-item img{width:32px;height:32px;object-fit:contain;}
  .trade-item span{flex:1;font-size:13px;text-transform:capitalize;}
  .x-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;}
  .primary-btn{background:var(--accent);color:var(--bg-deep);border:none;padding:10px 20px;border-radius:10px;cursor:pointer;font-family:'Roboto',sans-serif;font-weight:700;margin-top:10px;}
  .search-results{max-height:180px;overflow-y:auto;margin-top:8px;}
  .sr-item{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;cursor:pointer;}
  .sr-item:hover{background:var(--bg-deep);}
  .sr-item img{width:28px;height:28px;object-fit:contain;}

  #tradeCardWrap{margin-top:20px;}
  #tradeCard{
    width:900px;max-width:100%;
    background:
      radial-gradient(ellipse 60% 45% at 28% 18%, rgba(255,79,163,0.38) 0%, transparent 60%),
      radial-gradient(ellipse 55% 45% at 75% 82%, rgba(216,59,171,0.28) 0%, transparent 55%),
      conic-gradient(from 200deg at 50% 45%, rgba(233,30,140,0.20) 0deg, rgba(45,17,64,0) 90deg, rgba(233,30,140,0.16) 200deg, rgba(45,17,64,0) 300deg, rgba(233,30,140,0.20) 360deg),
      linear-gradient(135deg,#33184A 0%,#1D0E30 45%,#0A0512 100%);
    border-radius:24px;padding:26px;color:white;font-family:'Roboto',sans-serif;
    position:relative;overflow:hidden;
  }
  #tradeCard::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 3px, transparent 3px 22px),
      repeating-linear-gradient(25deg, rgba(255,79,163,0.08) 0 2px, transparent 2px 32px);
    mix-blend-mode:screen;
  }
  #tradeCard::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 8%, rgba(255,255,255,0.10) 0%, transparent 35%);
  }
  .tc-title{text-align:center;font-family:'Roboto',sans-serif;font-weight:900;font-size:30px;text-shadow:0 0 14px rgba(255,79,163,0.55), 0 2px 0 rgba(0,0,0,0.4);position:relative;margin-bottom:14px;}
  .tc-section-label{display:flex;align-items:center;gap:10px;font-family:'Roboto',sans-serif;font-weight:700;font-size:19px;margin:14px 0 8px;position:relative;text-shadow:0 1px 4px rgba(0,0,0,0.4);}
  .tc-ball{width:24px;height:24px;border-radius:50%;background:linear-gradient(#fff 50%,#eee 50%);border:2px solid #222;position:relative;}
  .tc-ball::before{content:"";position:absolute;top:9px;left:0;right:0;height:3px;background:#222;}
  .tc-ball::after{content:"";position:absolute;top:7px;left:8px;width:8px;height:8px;background:#fff;border:2px solid #222;border-radius:50%;}
  .tc-box{background:rgba(255,255,255,0.94);border-radius:16px;padding:16px;min-height:110px;position:relative;}
  .tc-grid{display:flex;flex-wrap:wrap;gap:18px;}
  .tc-mon{position:relative;width:110px;text-align:center;}
  .tc-mon img{width:96px;height:96px;object-fit:contain;}
  .tc-mon .tc-name{font-size:11px;color:#333;text-transform:capitalize;font-weight:600;}
  .tc-sparkle{position:absolute;color:#C2247E;font-size:14px;}
  .tc-empty{color:#8a8a8a;font-size:13px;padding:20px;text-align:center;width:100%;}
  .tc-trainer-row{
    margin-top:16px;
    background:rgba(255,255,255,0.94);
    border-radius:16px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .tc-trainer-label{font-size:11px;color:#8a5b8c;text-transform:uppercase;letter-spacing:.06em;font-weight:700;text-align:center;}
  .tc-trainer-code{font-size:20px;color:#9C2E7D;font-weight:600;letter-spacing:.04em;text-align:center;}

  .trainer-code-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:16px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .trainer-code-row label{font-size:13px;color:var(--text-dim);font-family:'Roboto',sans-serif;font-weight:700;}
  .trainer-code-row input{width:180px;}
  .trainer-code-input-group{display:flex;align-items:center;gap:6px;}
  .copy-btn{
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text-dim);
    cursor:pointer;
    transition:.15s;
    flex-shrink:0;
  }
  .copy-btn:hover{border-color:var(--accent);color:var(--text);}

  .banner{background:rgba(255,75,75,0.12);border:1px solid var(--red);color:var(--text);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;}
  .retry-btn{background:var(--red);border:none;color:white;padding:6px 14px;border-radius:8px;cursor:pointer;margin-left:10px;}
  .empty-note{color:var(--text-dim);font-size:13px;padding:20px;text-align:center;}
  .signin-panel{max-width:420px;margin:80px auto;text-align:center;padding:44px 30px;}
  .signin-panel .primary-btn{padding:12px 26px;font-size:15px;}

  .raid-badges{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:4px;}
  .raid-badge{font-size:9px;padding:2px 6px;border-radius:999px;background:var(--bg-panel-2);color:var(--text-dim);border:1px solid var(--line);}
  .raid-badge.shiny{color:var(--gold);border-color:var(--gold);}
  .raid-badge.weather{color:var(--accent);border-color:var(--accent);}

  #raidCardWrap{margin-top:20px;}
  #raidCard{
    width:460px;max-width:100%;
    background:
      radial-gradient(ellipse 60% 45% at 25% 15%, rgba(80,150,255,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 55% 45% at 78% 85%, rgba(255,90,60,0.28) 0%, transparent 55%),
      conic-gradient(from 200deg at 50% 45%, rgba(80,150,255,0.18) 0deg, rgba(10,15,30,0) 90deg, rgba(255,90,60,0.14) 200deg, rgba(10,15,30,0) 300deg, rgba(80,150,255,0.18) 360deg),
      linear-gradient(135deg,#122238 0%,#0B1728 45%,#050A14 100%);
    border-radius:24px;padding:22px;color:white;font-family:'Roboto',sans-serif;
    position:relative;overflow:hidden;
  }
  #raidCard .tc-title{font-size:24px;}
  #raidCard::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 3px, transparent 3px 22px),
      repeating-linear-gradient(25deg, rgba(80,150,255,0.08) 0 2px, transparent 2px 32px);
    mix-blend-mode:screen;
  }

function renderSignIn(){

function signIn(){

async function handleTokenResponse(resp){
  if(resp.error){
    console.error('auth error', resp);
    return;
  }
  accessToken = resp.access_token;
  tokenExpiryMs = Date.now() + (resp.expires_in * 1000);
  try{
    const uRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    userProfile = await uRes.json();
  }catch(e){ /* profile is cosmetic only */ }
  await bootApp();
}

function ensureFreshToken(){
  return new Promise((resolve, reject)=>{
    if(accessToken && Date.now() < tokenExpiryMs - 60000){ resolve(); return; }
    tokenClient.callback = (resp)=>{
      if(resp.error){ reject(resp); return; }
      accessToken = resp.access_token;
      tokenExpiryMs = Date.now() + (resp.expires_in * 1000);
      resolve();
    };
    tokenClient.requestAccessToken({ prompt: '' });
  });
}

function signOut(){
  if(accessToken){
    try{ google.accounts.oauth2.revoke(accessToken, ()=>{}); }catch(e){}

/* ---------------- DRIVE STORAGE ---------------- */

async function driveEnsureFile(){
  if(driveFileId) return driveFileId;
  await ensureFreshToken();
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: `Bearer ${accessToken}` }
  });
  const json = await res.json();
  if(json.files && json.files.length){
    driveFileId = json.files[0].id;
    return driveFileId;
  }
  const boundary = 'pokedexboundary';
  const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({ dexData: {} })}\r\n` +
    `--${boundary}--`;
  const createRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: {
      Authorization: `Bearer ${accessToken}`,
      'Content-Type': `multipart/related; boundary=${boundary}`
    },
    body
  });
  const createJson = await createRes.json();
  driveFileId = createJson.id;
  return driveFileId;
}

async function loadDexData(){
  try{
    const fileId = await driveEnsureFile();
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.ok){
      const json = await res.json();
      dexData = json.dexData || {};
      trainerCode = (json.profile && json.profile.trainerCode) || '';
    } else {
      dexData = {};
    }
  }catch(e){
    console.error('Drive load failed', e);
    dexData = {};
  }
  migrateAllDexData();
}

function migrateAllDexData(){
  Object.keys(dexData).forEach(idStr=>{
    const e = dexData[idStr];
    if(e.caughtNormal === undefined) migrateEntryToBooleans(e);

    Object.keys(e.forms).forEach(fname=>{
      const fe = e.forms[fname];
      if(fe.caughtNormal === undefined) migrateEntryToBooleans(fe);
    });
  });
}

/* ---------------- POGOAPI.NET — GO-specific accuracy layer ----------------
   PoGoAPI supplies data only (released status, shiny availability, which
   regional forms are confirmed in GO). Images always come from the existing
   PokeAPI-based sprite pipeline below — this just tells us which Pokémon
   and forms are real, and what to say about their shiny status. */
const POGOAPI_BASE = 'https://pogoapi.net/api/v1';
const POGOAPI_CACHE_KEY = 'pogodex-pogoapi-cache-v1';
const POGOAPI_CACHE_MAX_AGE = 24 * 60 * 60 * 1000; // refresh daily
let pogoReleased = {};
let pogoShiny = {};
let pogoAlolan = {};
let pogoGalarian = {};
let pogoShadow = {};
let pogoApiLoaded = false;

async function loadPoGoApiData(){
  try{
    const cached = localStorage.getItem(POGOAPI_CACHE_KEY);
    if(cached){
      const parsed = JSON.parse(cached);
      if(Date.now() - parsed.ts < POGOAPI_CACHE_MAX_AGE){
        pogoReleased = parsed.released || {};
        pogoShiny = parsed.shiny || {};
        pogoAlolan = parsed.alolan || {};
        pogoGalarian = parsed.galarian || {};
        pogoShadow = parsed.shadow || {};
        pogoApiLoaded = true;
        return;
      }
    }
  }catch(e){}
  try{
    const [rel, shiny, alolan, galar, shadow] = await Promise.all([
      fetch(`${POGOAPI_BASE}/released_pokemon.json`).then(r=>r.json()),
      fetch(`${POGOAPI_BASE}/shiny_pokemon.json`).then(r=>r.json()),
      fetch(`${POGOAPI_BASE}/alolan_pokemon.json`).then(r=>r.json()),
      fetch(`${POGOAPI_BASE}/galarian_pokemon.json`).then(r=>r.json()),
      fetch(`${POGOAPI_BASE}/shadow_pokemon.json`).then(r=>r.json())
    ]);
    pogoReleased = rel || {};
    pogoShiny = shiny || {};
    pogoAlolan = alolan || {};
    pogoGalarian = galar || {};
    pogoShadow = shadow || {};
    pogoApiLoaded = true;
    try{
      localStorage.setItem(POGOAPI_CACHE_KEY, JSON.stringify({
        ts: Date.now(), released: pogoReleased, shiny: pogoShiny,
        alolan: pogoAlolan, galarian: pogoGalarian, shadow: pogoShadow
      }));
    }catch(e){}
  }catch(e){
    console.error('PoGoAPI load failed — continuing without the GO-accuracy layer', e);
    pogoApiLoaded = false;
  }
}

/* ---------------- RAID BOSSES — pokemon-go-api.github.io ----------------

/* ---------------- EVENTS — ScrapedDuck (LeekDuck.com) ----------------
   ScrapedDuck scrapes LeekDuck.com with their permission and publishes a

   wait at least 5 minutes between fetches, so an hour is comfortably polite. */
const EVENTS_API = 'https://raw.githubusercontent.com/bigfoott/ScrapedDuck/data/events.min.json';

  try{
    const cached = localStorage.getItem(EVENTS_CACHE_KEY);

        eventsData = parsed.data || [];

  }catch(e){}

// ISO strings ending in "Z" are true UTC and convert to the viewer's local
// time automatically. ScrapedDuck's local-time events omit the "Z", and
// per the ISO 8601 spec, JS's Date parser already treats an offset-less
// string as local time — so no manual timezone handling is needed here.
function categorizedEvents(){
  const now = Date.now();
  const current = [];
  const upcoming = [];
  eventsData.forEach(e=>{
    const start = e.start ? new Date(e.start).getTime() : null;
    const end = e.end ? new Date(e.end).getTime() : null;
    if(end !== null && !isNaN(end) && end < now) return; // already ended
    if(start !== null && !isNaN(start) && start > now){ upcoming.push(e); return; }
    current.push(e);
  });
  current.sort((a,b)=>{
    const ae = (a.end && !isNaN(new Date(a.end).getTime())) ? new Date(a.end).getTime() : Infinity;
    const be = (b.end && !isNaN(new Date(b.end).getTime())) ? new Date(b.end).getTime() : Infinity;
    return ae - be;
  });
  upcoming.sort((a,b)=> new Date(a.start).getTime() - new Date(b.start).getTime());
  return {current, upcoming};
}

function formatEventDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleString(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
}

function renderEventCardHtml(e){
  const startLabel = formatEventDate(e.start);
  const endLabel = formatEventDate(e.end);
  let rangeLabel = '';
  if(startLabel && endLabel) rangeLabel = `${startLabel} – ${endLabel}`;
  else if(startLabel) rangeLabel = `Starts ${startLabel}`;
  else if(endLabel) rangeLabel = `Ends ${endLabel}`;
  return `
    <div class="event-card" style="cursor:pointer;" onclick="showEventModal('${e.eventID}')">
      ${e.image ? `<img src="${e.image}" loading="lazy" alt="">` : ''}
      <div class="event-card-body">
        <div class="event-badge">${e.heading || e.eventType || 'Event'}</div>
        <div class="event-name">${e.name || ''}</div>
        ${rangeLabel ? `<div class="event-dates mono">${rangeLabel}</div>` : ''}
      </div>
    </div>
  `;
}

          `).join('')}</div>

      ${d.shinies && d.shinies.length ? `

            <div class="event-chip"><img src="${s.image}" alt=""><span>${s.name}</span></div>
          `).join('')}</div>
        </div>` : ''}
    `;
  }
  if(extraData.breakthrough){
    const d = extraData.breakthrough;
    return `
      <div class="event-detail-section">

function isReleasedInGo(id){
  // If PoGoAPI didn't load, don't penalize the whole dex — treat everything as released.
  if(!pogoApiLoaded || Object.keys(pogoReleased).length === 0) return true;
  return !!pogoReleased[id];
}

function shinyAvailabilityText(id){
  const info = pogoShiny[id];
  if(!info) return 'Shiny not yet available in GO';
  const ways = [];
  if(info.found_wild) ways.push('Wild');
  if(info.found_raid) ways.push('Raid');
  if(info.found_egg) ways.push('Egg');
  if(info.found_evolution) ways.push('Evolution');
  if(info.found_research) ways.push('Research');
  if(info.found_photobomb) ways.push('Photobomb');
  return ways.length ? `Shiny available: ${ways.join(', ')}` : 'Shiny not yet available in GO';
}

function migrateEntryToBooleans(e){
  // Handles migration from either prior data shape into the current
  // simple boolean model: caughtNormal/caughtShiny + tradeAvailNormal/tradeAvailShiny.
  if(e.ownedNormal !== undefined){
    // Coming from the v1.0 quantity model.
    e.caughtNormal = e.ownedNormal > 0;
    e.caughtShiny = e.ownedShiny > 0;
    e.tradeAvailNormal = e.tradeNormal > 0;
    e.tradeAvailShiny = e.tradeShiny > 0;
    delete e.ownedNormal;
    delete e.ownedShiny;
    delete e.tradeNormal;
    delete e.tradeShiny;
  } else if(e.caught !== undefined){
    // Coming from the original pre-v1.0 boolean+tradeQty model.
    const wasCaught = !!e.caught;
    const wasShiny = !!e.shiny;
    const oldQty = e.tradeQty || 0;
    e.caughtNormal = wasCaught && !wasShiny;
    e.caughtShiny = wasCaught && wasShiny;
    e.tradeAvailNormal = e.caughtNormal && oldQty > 0;
    e.tradeAvailShiny = e.caughtShiny && oldQty > 0;
    delete e.caught;
    delete e.shiny;
    delete e.tradeQty;
  } else {
    e.caughtNormal = false;
    e.caughtShiny = false;
    e.tradeAvailNormal = false;
    e.tradeAvailShiny = false;
  }
}

function getEntry(id){
  if(!dexData[id]) dexData[id] = {caughtNormal:false, caughtShiny:false, tradeAvailNormal:false, tradeAvailShiny:false, forms:{}};
  const e = dexData[id];
  if(e.caughtNormal === undefined) migrateEntryToBooleans(e);
  if(!e.forms) e.forms = {};
  return e;
}
function getFormEntry(id, formName){
  const e = getEntry(id);
  if(!e.forms[formName]) e.forms[formName] = {caughtNormal:false, caughtShiny:false, tradeAvailNormal:false, tradeAvailShiny:false};
  const fe = e.forms[formName];
  if(fe.caughtNormal === undefined) migrateEntryToBooleans(fe);
  return fe;
}

async function loadForms(id){
  if(formCatalog[id]) return formCatalog[id];
  try{
    const cached = localStorage.getItem('pokedex-forms-v4-'+id);
    if(cached){ formCatalog[id] = JSON.parse(cached); return formCatalog[id]; }
  }catch(e){}
  try{
    const sRes = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}/`);
    const species = await sRes.json();
    const varieties = (species.varieties||[]).filter(v=>!v.is_default);
    const forms = [];
    for(const v of varieties){
      // Show every PokeAPI variety (regional forms, event costumes, caps,
      // etc.) rather than filtering any out — PoGoAPI only confirms Alolan/
      // Galarian releases specifically, so excluding anything else risked
      // hiding real GO content it simply doesn't track (e.g. Pikachu's
      // costume/cap variants, which are real GO releases but aren't
      // regional forms). Confirmation status is shown as a badge instead.
      const isAlolan = v.pokemon.name.endsWith('-alola');
      const isGalarian = v.pokemon.name.endsWith('-galar');
      const confirmed = (isAlolan && pogoAlolan[id]) || (isGalarian && pogoGalarian[id]) || (!isAlolan && !isGalarian);
      try{
        const pRes = await fetch(v.pokemon.url);
        const p = await pRes.json();
        const art = p.sprites && p.sprites.other && p.sprites.other['official-artwork'];
        const reg = p.sprites || {};
        // PokeAPI's official-artwork field is frequently null for regional/alternate
        // form varieties (a known gap in their sprite data), so fall back to the
        // variety's regular sprite before falling back to the base species artwork.
        forms.push({
          name: v.pokemon.name,
          displayName: v.pokemon.name.replace(`${species.name}-`,'').replace(/-/g,' ') || v.pokemon.name,
          sprite: (art && art.front_default) || reg.front_default || artUrl(id,false),
          shinySprite: (art && art.front_shiny) || reg.front_shiny || artUrl(id,true),
          goConfirmed: confirmed
        });
      }catch(e){}
    }
    // Shadow isn't a PokeAPI variety at all (it's GO-exclusive), so add it
    // synthetically when PoGoAPI confirms this species has a Shadow form.
    // There's no distinct Shadow artwork source available, so it reuses the
    // base species art rather than a Shadow-specific sprite.
    if(pogoShadow[id]){
      forms.push({
        name: `${species.name}-shadow`,
        displayName: 'Shadow',
        sprite: artUrl(id, false),
        shinySprite: artUrl(id, true),
        goConfirmed: true
      });
    }
    formCatalog[id] = forms;
    try{ localStorage.setItem('pokedex-forms-v4-'+id, JSON.stringify(forms)); }catch(e){}
    return forms;
  }catch(e){
    formCatalog[id] = [];
    return [];
  }
}

  const digits = raw.replace(/\D/g,'').slice(0,12);
  return digits.replace(/(\d{4})(?=\d)/g,'$1 ').trim();

function copyTrainerCode(){
  const input = document.getElementById('trainerCodeInput');

function renderDexSections(filtered){
  const grid = document.getElementById('dexGrid');
  if(!grid) return;
  const grouped = !dexSearch && dexRegion === 'all';
  if(!grouped){
    grid.innerHTML = renderCardsHtml(filtered);
    return;
  }
  let html = '';
  REGIONS.forEach(r=>{
    const items = filtered.filter(p=>p.id>=r.min && p.id<=r.max);
    if(!items.length) return;
    const collapsed = isRegionCollapsed(r.key);
    const caughtCount = items.filter(p=>{
      const e = dexData[p.id];
      return e && (e.caughtNormal || e.caughtShiny);
    }).length;
    const complete = items.length>0 && caughtCount === items.length;
    const starters = REGION_STARTERS[r.key] || [];
    const gradient = REGION_GRADIENTS[r.key] || 'linear-gradient(135deg,var(--bg-panel),var(--bg-panel-2))';
    html += `
      <div class="region-section">
        <button class="region-card" style="background:${gradient};" onclick="toggleRegion('${r.key}')">
          <div class="region-card-starters">
            ${starters.map(id=>`<img src="${artUrl(id,false)}" alt="" loading="lazy">`).join('')}
          </div>
          <div class="region-card-info">
            <div class="region-card-name">${r.label}</div>
            ${complete
              ? `<div class="region-card-complete"><span class="region-pokeball"></span> Complete!</div>`
              : `<div class="region-card-fraction mono">${caughtCount} / ${items.length}</div>`}
          </div>
          <span class="region-card-chevron">${collapsed ? '▸' : '▾'}</span>
        </button>
        ${collapsed ? '' : renderCardsHtml(items)}
      </div>
    `;
  });
  grid.innerHTML = html || '<div class="empty-note">No Pokémon match that search.</div>';
}

  const forms = formCatalog[id];
  let formsHtml;
  if(forms === undefined){
    formsHtml = '<div class="spinner"></div>';
  } else if(!forms.length){
    formsHtml = '<div class="empty-note" style="padding:8px 0;">No alternate forms found for this species.</div>';
  } else {
    formsHtml = forms.map(f=>{
      const fe = getFormEntry(id, f.name);
      const formShiny = fe.caughtShiny;
      return `
        <div class="form-item">
          <img src="${formShiny ? f.shinySprite : f.sprite}" alt="${f.displayName}">
          <div class="fname">${f.displayName}${f.goConfirmed ? '' : ' <span class="unreleased-badge">(unconfirmed in GO)</span>'}</div>
          <div class="form-toggle-row">
            <button class="qt-btn ${fe.caughtNormal?'active':''}" title="Mark caught" onclick="toggleFormCaught(${id}, '${f.name}')">✓</button>
            <button class="qt-btn shiny ${fe.caughtShiny?'active':''}" title="Mark shiny" onclick="toggleFormShiny(${id}, '${f.name}')">${SPARKLE_ICON}</button>
            <span class="var-trade-label">Trade:</span>
            <button class="qt-btn ${fe.tradeAvailNormal?'active':''}" title="Trade available (normal)" ${fe.caughtNormal?'':'disabled'} onclick="toggleFormTradeAvail(${id}, '${f.name}', 'normal')">N</button>
            <button class="qt-btn shiny ${fe.tradeAvailShiny?'active':''}" title="Trade available (shiny)" ${fe.caughtShiny?'':'disabled'} onclick="toggleFormTradeAvail(${id}, '${f.name}', 'shiny')">${SPARKLE_ICON}</button>
          </div>
        </div>
      `;
    }).join('');
  }
  return `
    ${tradeRow}
    <div class="forms-section" style="border-top:none;margin-top:10px;padding-top:10px;">
      <h3 style="margin:0 0 8px;font-size:14px;">Regional / Alternate Forms</h3>
      ${formsHtml}
    </div>
  `;
}

function buildOwnedRows(){
  const rows = [];
  Object.keys(dexData).forEach(idStr=>{
    const id = parseInt(idStr);
    const e = getEntry(id);
    const species = speciesList.find(p=>p.id===id);
    if(!species) return;
    if(e.caughtNormal) rows.push({id, form:null, variant:'normal', name:species.name, tradeAvail:e.tradeAvailNormal});
    if(e.caughtShiny) rows.push({id, form:null, variant:'shiny', name:species.name, tradeAvail:e.tradeAvailShiny});
    Object.keys(e.forms||{}).forEach(fname=>{
      const fe = getFormEntry(id, fname);
      const cat = (formCatalog[id]||[]).find(f=>f.name===fname);
      const label = cat ? `${cat.displayName} ${species.name}` : fname;
      if(fe.caughtNormal) rows.push({id, form:fname, variant:'normal', name:label, tradeAvail:fe.tradeAvailNormal});
      if(fe.caughtShiny) rows.push({id, form:fname, variant:'shiny', name:label, tradeAvail:fe.tradeAvailShiny});
    });
  });
  return rows;
}

function rowSprite(r){
  if(r.form){
    const cat = (formCatalog[r.id]||[]).find(f=>f.name===r.form);
    return cat ? (r.variant==='shiny' ? cat.shinySprite : cat.sprite) : null;
  }
  return artUrl(r.id, r.variant==='shiny');
}

const SHEETS_API = 'https://sheets.googleapis.com/v4/spreadsheets';

function buildInventoryExportRows(){
  return buildOwnedRows().map(r=>{
    const sprite = rowSprite(r) || artUrl(r.id, r.variant==='shiny');
    return [
      `=IMAGE("${sprite}")`,
      r.id,
      r.name,
      r.variant==='shiny' ? 'Yes' : 'No',
      r.tradeAvail ? 'Yes' : 'No'
    ];
  });
}

async function exportInventoryToSheets(){
  const btn = document.getElementById('exportSheetsBtn');
  const rows = buildInventoryExportRows();
  if(!rows.length){
    alert('Nothing to export yet — mark some Pokémon as caught first.');
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = 'Exporting…'; }
  try{
    await ensureFreshToken();

    const title = `PogoDex Inventory Export — ${new Date().toLocaleDateString()}`;
    const createRes = await fetch(SHEETS_API, {
      method: 'POST',
      headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ properties: { title } })
    });
    if(!createRes.ok) throw new Error('Failed to create spreadsheet');
    const created = await createRes.json();
    const spreadsheetId = created.spreadsheetId;

    const header = ['Image', 'Dex #', 'Name', 'Shiny', 'Trade Available'];
    const values = [header, ...rows];
    const range = encodeURIComponent('Sheet1!A1');
    const writeRes = await fetch(`${SHEETS_API}/${spreadsheetId}/values/${range}?valueInputOption=USER_ENTERED`, {
      method: 'PUT',
      headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ values })
    });
    if(!writeRes.ok) throw new Error('Failed to write values');

    await fetch(`${SHEETS_API}/${spreadsheetId}:batchUpdate`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        requests: [
          { updateDimensionProperties: { range: { sheetId: 0, dimension: 'COLUMNS', startIndex: 0, endIndex: 1 }, properties: { pixelSize: 90 }, fields: 'pixelSize' } },
          { updateDimensionProperties: { range: { sheetId: 0, dimension: 'ROWS', startIndex: 1, endIndex: values.length }, properties: { pixelSize: 80 }, fields: 'pixelSize' } },
          { repeatCell: { range: { sheetId: 0, startRowIndex: 0, endRowIndex: 1 }, cell: { userEnteredFormat: { textFormat: { bold: true } } }, fields: 'userEnteredFormat.textFormat.bold' } }
        ]
      })
    });

    const url = created.spreadsheetUrl || `https://docs.google.com/spreadsheets/d/${spreadsheetId}/edit`;
    window.open(url, '_blank');
  }catch(e){
    console.error('Sheets export failed', e);
    alert('Export failed. Check your connection and try again.');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Export to Google Sheets'; }
  }
}

async function ensureFormsLoadedForInventory(){
  const idsNeedingForms = new Set();
  Object.keys(dexData).forEach(idStr=>{
    const id = parseInt(idStr);
    const e = dexData[idStr];
    Object.keys(e.forms||{}).forEach(fname=>{
      const fe = e.forms[fname];
      if((fe.caughtNormal || fe.caughtShiny) && !formCatalog[id]) idsNeedingForms.add(id);
    });
  });
  if(idsNeedingForms.size) await Promise.all(Array.from(idsNeedingForms).map(id=>loadForms(id)));
}

// Every caught species AND every caught form/variant, flat — not nested
// behind a "view variations" panel like the Pokédex tab. Marking tradeable
// happens with one click right on the card; that flag doubles as both the
// toggle state and what "Generate Trade Card" reads from.
function buildInventoryGroups(){
  const groups = [];
  Object.keys(dexData).forEach(idStr=>{
    const id = parseInt(idStr);
    const e = getEntry(id);
    const species = speciesList.find(p=>p.id===id);
    if(!species) return;
    if(e.caughtNormal || e.caughtShiny){
      groups.push({id, form:null, name:species.name, caughtNormal:e.caughtNormal, caughtShiny:e.caughtShiny, tradeAvailNormal:e.tradeAvailNormal, tradeAvailShiny:e.tradeAvailShiny});
    }
    Object.keys(e.forms||{}).forEach(fname=>{
      const fe = getFormEntry(id, fname);
      if(fe.caughtNormal || fe.caughtShiny){
        const cat = (formCatalog[id]||[]).find(f=>f.name===fname);
        const label = cat ? `${cat.displayName} ${species.name}` : fname;
        groups.push({id, form:fname, name:label, caughtNormal:fe.caughtNormal, caughtShiny:fe.caughtShiny, tradeAvailNormal:fe.tradeAvailNormal, tradeAvailShiny:fe.tradeAvailShiny});
      }
    });
  });
  return groups;
}

function renderOfferingCardHtml(item){

  } else {

function generateTradeCard(){
  // Snapshot exactly what's marked tradeable right now — Confirm Trade
  // Completed later acts on this snapshot, not on whatever happens to be
  // marked at confirm time, so re-toggling something afterward can't
  // accidentally clear the wrong items.
  tradeCardSnapshot = buildOwnedRows().filter(r=>r.tradeAvail).map(r=>`${r.id}:${r.form||''}:${r.variant}`);

  const offeringData = [];
  tradeCardSnapshot.forEach(key=>{
    const [idStr, formName, variant] = key.split(':');
    const id = parseInt(idStr);
    const species = speciesList.find(p=>p.id===id);
    if(!species) return;
    const shiny = variant === 'shiny';
    let name, sprite;
    if(formName){
      const cat = (formCatalog[id]||[]).find(f=>f.name===formName);
      name = cat ? `${cat.displayName} ${species.name}` : formName;
      sprite = cat ? (shiny ? cat.shinySprite : cat.sprite) : artUrl(id, shiny);
    } else {
      name = species.name;
      sprite = artUrl(id, shiny);
    }
    offeringData.push({ name, shiny, sprite });
  });

  const wantedBoxes = tradeWanted.map(w=>`
    <div class="tc-mon">
      ${w.shiny ? '<div class="tc-sparkle" style="top:0;right:6px;">✦</div><div class="tc-sparkle" style="bottom:20px;left:2px;">✦</div>' : ''}
      <img src="${artUrl(w.id, w.shiny)}" crossorigin="anonymous" onerror="this.src='${artUrl(w.id,false)}'">
      <div class="tc-name">${w.name}</div>
    </div>
  `).join('');

  const offerBoxes = offeringData.map(o=>`
    <div class="tc-mon">
      ${o.shiny ? '<div class="tc-sparkle" style="top:0;right:6px;">✦</div><div class="tc-sparkle" style="bottom:20px;left:2px;">✦</div>' : ''}
      <img src="${o.sprite}" crossorigin="anonymous">
      <div class="tc-name">${o.name}</div>
    </div>
  `).join('');

  const digits = trainerCode.replace(/\D/g,'');
  const formattedCode = digits ? digits.replace(/(\d{4})(?=\d)/g,'$1 ').trim() : '';

  tradeCardHtml = `
    <div id="tradeCard">
      <div class="tc-title">Pokémon Trade List</div>
      <div class="tc-section-label"><div class="tc-ball"></div> Wanted Pokémon</div>
      <div class="tc-box"><div class="tc-grid">${wantedBoxes || '<div class="tc-empty">Nothing added yet</div>'}</div></div>
      <div class="tc-section-label"><div class="tc-ball"></div> Pokémon I can offer</div>
      <div class="tc-box"><div class="tc-grid">${offerBoxes || '<div class="tc-empty">Nothing selected yet</div>'}</div></div>
      ${formattedCode ? `
      <div class="tc-trainer-row">
        <div class="tc-trainer-text">
          <div class="tc-trainer-label">Trainer Code</div>
          <div class="tc-trainer-code mono">${formattedCode}</div>
        </div>
      </div>` : ''}
    </div>
  `;
  renderTabContent();
}

function confirmTradeCompleted(){
  if(!tradeCardSnapshot.length){
    alert('Generate a trade card first — Confirm acts on whatever was on the most recently generated card.');
    return;
  }
  tradeCardSnapshot.forEach(key=>{
    const [idStr, formName, variant] = key.split(':');
    const id = parseInt(idStr);
    const target = formName ? getFormEntry(id, formName) : getEntry(id);
    if(variant === 'shiny') target.tradeAvailShiny = false;
    else target.tradeAvailNormal = false;
  });
  tradeCardSnapshot = [];
  tradeCardHtml = '';
  saveDexData();
  renderTabContent();
  alert('Trade recorded — those items are no longer marked as available to trade.');
}

function downloadTradeCard(){
  const node = document.getElementById('tradeCard');
  if(!node || typeof html2canvas==='undefined') return;
  html2canvas(node, {backgroundColor:null, scale:2, useCORS:true, allowTaint:false}).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'pokemon-trade-list.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

      </div>
      <div class="bezel-sub" style="margin-bottom:14px;">Data via pokemon-go-api, sourced from LeekDuck.com. Refreshes every few hours.</div>
      ${tiersWithBosses.length ? tiersWithBosses.map(t=>`
        <div class="region-section">
          <div class="region-title" style="padding:10px 4px 6px;">${t.label}</div>
          <div class="dex-cards-grid">
            ${(raidBossData[t.key]||[]).map(b=>renderRaidBossCardHtml(b)).join('')}
          </div>
        </div>
      `).join('') : '<div class="empty-note">No current raid data available.</div>'}
    </div>
    <div id="raidCardWrap"></div>
  `;
}

function renderRaidBossCardHtml(b){
  const name = raidBossName(b);
  const img = (b.assets && b.assets.image) || '';
  const cp = b.cpRange ? `${b.cpRange[0]}-${b.cpRange[1]} CP` : '';
  return `
    <div class="dex-card">
      <div class="dex-card-body">
        <img src="${img}" loading="lazy" alt="${name}">
        <div class="dex-name">${name}</div>
        <div class="dex-num mono">${cp}</div>
        <div class="raid-badges">
          ${b.shiny ? '<span class="raid-badge shiny">Shiny Available</span>' : ''}
          ${(b.weather && b.weather.length) ? `<span class="raid-badge weather">${b.weather.join(' / ')} boosted</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

const WEATHER_TYPES = ['Sunny/Clear','Rainy','Partly Cloudy','Cloudy','Windy','Snow','Fog'];

function isWeatherActive(w){
  return raidCardWeatherTypes.some(x => x.toLowerCase().includes(w.toLowerCase()) || w.toLowerCase().includes(x.toLowerCase()));
}

function toggleWeatherType(w){
  if(isWeatherActive(w)){
    raidCardWeatherTypes = raidCardWeatherTypes.filter(x => !(x.toLowerCase().includes(w.toLowerCase()) || w.toLowerCase().includes(x.toLowerCase())));
  } else {
    raidCardWeatherTypes.push(w);
  }
  renderRaidCardBuilder();
}

function openRaidCardBuilder(){
  raidCardSelectedId = null;
  raidCardSearch = '';
  raidCardHtml = '';
  raidCardTierKey = 'lvl5';
  raidCardCpMin = '';
  raidCardCpMax = '';
  raidCardCpBoostMin = '';
  raidCardCpBoostMax = '';
  raidCardShiny = false;
  raidCardWeatherBoosted = false;
  raidCardWeatherTypes = [];
  renderRaidCardBuilder();
  const wrap = document.getElementById('raidCardWrap');
  if(wrap) wrap.scrollIntoView({behavior:'smooth', block:'start'});
}

// The search input is rendered once here and never rebuilt on keystroke —
// only updateRaidCardSearchResults() touches the results list below it.
// Rebuilding the input itself on every keystroke was what caused the
// "only one letter registers" bug, since the input loses focus the
// instant its own innerHTML gets replaced.
function renderRaidCardBuilder(){
  const wrap = document.getElementById('raidCardWrap');
  if(!wrap) return;
  const selected = raidCardSelectedId ? speciesList.find(p=>p.id===raidCardSelectedId) : null;

  wrap.innerHTML = `
    <div class="panel" style="margin-top:16px;">
      <h3 class="display" style="margin-top:0;">Raid Card Builder</h3>
      <input type="text" id="raidCardSearchInput" placeholder="Search any Pokémon..." value="${raidCardSearch}">
      <div class="search-results" id="raidCardSearchResults"></div>
      ${selected ? renderRaidCardFieldsHtml(selected) : ''}
      <div id="raidCardOutput"></div>
    </div>
  `;
  document.getElementById('raidCardSearchInput').oninput = (ev)=>{
    raidCardSearch = ev.target.value;
    updateRaidCardSearchResults();
  };
  updateRaidCardSearchResults();
  if(selected) wireRaidCardFieldEvents();
  if(raidCardHtml){
    document.getElementById('raidCardOutput').innerHTML = raidCardHtml + `
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="primary-btn" onclick="downloadRaidCard()">Download Image</button>
      </div>
    `;
  }
}

function updateRaidCardSearchResults(){
  const resultsEl = document.getElementById('raidCardSearchResults');
  if(!resultsEl) return;
  const q = raidCardSearch.toLowerCase();
  const results = q ? speciesList.filter(p=>p.name.includes(q) || String(p.id)===q).slice(0,20) : [];
  resultsEl.innerHTML = results.map(p=>`
    <div class="sr-item" onclick="selectRaidCardSpecies(${p.id})">
      <img src="${artUrl(p.id,false)}">
      <span style="text-transform:capitalize;font-size:13px;">${p.name}</span>
    </div>
  `).join('');
}

function renderRaidCardFieldsHtml(species){
  const match = allRaidBosses().find(b=>raidBossName(b).toLowerCase() === species.name.toLowerCase());
  return `
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px;">
        <img src="${artUrl(species.id, raidCardShiny)}" onerror="this.src='${artUrl(species.id,false)}'" style="width:56px;height:56px;object-fit:contain;">
        <div>
          <div style="font-weight:700;text-transform:capitalize;">${species.name}</div>
          <div class="bezel-sub" style="margin:0;">${match ? 'Auto-filled from live raid data — feel free to adjust.' : 'Not in the current live raid rotation — enter details manually.'}</div>
        </div>
      </div>
      <div class="search-row" style="margin-bottom:10px;">
        <select id="raidTierSelect">
          ${RAID_TIERS.map(t=>`<option value="${t.key}" ${raidCardTierKey===t.key?'selected':''}>${t.label}</option>`).join('')}
        </select>
        <label class="mini-toggle"><input type="checkbox" id="raidShinyToggle" ${raidCardShiny?'checked':''}> Shiny Available</label>
      </div>
      <div class="search-row" style="margin-bottom:6px;">
        <input type="number" id="raidCpMin" placeholder="CP min" value="${raidCardCpMin}" style="width:100px;">
        <input type="number" id="raidCpMax" placeholder="CP max" value="${raidCardCpMax}" style="width:100px;">
        <span class="bezel-sub" style="margin:0;">Normal CP range</span>
      </div>
      <div class="search-row" style="margin-bottom:10px;">
        <input type="number" id="raidCpBoostMin" placeholder="CP min" value="${raidCardCpBoostMin}" style="width:100px;">
        <input type="number" id="raidCpBoostMax" placeholder="CP max" value="${raidCardCpBoostMax}" style="width:100px;">
        <span class="bezel-sub" style="margin:0;">Weather-boosted CP range</span>
      </div>
      <div style="margin-bottom:10px;">
        <div class="var-trade-label" style="margin-bottom:6px;">Boost Weather</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${WEATHER_TYPES.map(w=>`<button type="button" class="tab-btn ${isWeatherActive(w)?'active':''}" style="padding:6px 12px;font-size:12px;" onclick="toggleWeatherType('${w}')">${w}</button>`).join('')}
        </div>
      </div>
      <div class="toggle-row" style="border-top:none;">
        <label for="raidWeatherToggle">Show Weather Boosted on Card</label>
        <label class="switch"><input type="checkbox" id="raidWeatherToggle" ${raidCardWeatherBoosted?'checked':''}><span class="slider"></span></label>
      </div>
      <button class="primary-btn" onclick="generateRaidCard()">Generate Raid Card</button>
    </div>
  `;
}

function wireRaidCardFieldEvents(){
  const tierSel = document.getElementById('raidTierSelect');
  if(tierSel) tierSel.onchange = (ev)=>{ raidCardTierKey = ev.target.value; };
  const shinyToggle = document.getElementById('raidShinyToggle');
  if(shinyToggle) shinyToggle.onchange = (ev)=>{ raidCardShiny = ev.target.checked; };
  const cpMin = document.getElementById('raidCpMin');
  if(cpMin) cpMin.oninput = (ev)=>{ raidCardCpMin = ev.target.value; };
  const cpMax = document.getElementById('raidCpMax');
  if(cpMax) cpMax.oninput = (ev)=>{ raidCardCpMax = ev.target.value; };
  const cpBoostMin = document.getElementById('raidCpBoostMin');
  if(cpBoostMin) cpBoostMin.oninput = (ev)=>{ raidCardCpBoostMin = ev.target.value; };
  const cpBoostMax = document.getElementById('raidCpBoostMax');
  if(cpBoostMax) cpBoostMax.oninput = (ev)=>{ raidCardCpBoostMax = ev.target.value; };
  const weatherToggle = document.getElementById('raidWeatherToggle');
  if(weatherToggle) weatherToggle.onchange = (ev)=>{ raidCardWeatherBoosted = ev.target.checked; };
}

function selectRaidCardSpecies(id){
  const species = speciesList.find(p=>p.id===id);
  if(!species) return;
  raidCardSelectedId = id;
  raidCardSearch = '';
  raidCardHtml = '';
  const match = allRaidBosses().find(b=>raidBossName(b).toLowerCase() === species.name.toLowerCase());
  if(match){
    raidCardTierKey = match.tierKey;
    raidCardCpMin = match.cpRange ? match.cpRange[0] : '';
    raidCardCpMax = match.cpRange ? match.cpRange[1] : '';
    raidCardCpBoostMin = match.cpRangeBoost ? match.cpRangeBoost[0] : '';
    raidCardCpBoostMax = match.cpRangeBoost ? match.cpRangeBoost[1] : '';
    raidCardShiny = !!match.shiny;
    raidCardWeatherTypes = match.weather ? match.weather.slice() : [];
  } else {
    raidCardTierKey = 'lvl5';
    raidCardCpMin = '';
    raidCardCpMax = '';
    raidCardCpBoostMin = '';
    raidCardCpBoostMax = '';
    raidCardShiny = false;
    raidCardWeatherTypes = [];
  }
  raidCardWeatherBoosted = false;
  renderRaidCardBuilder();
}

function generateRaidCard(){
  const species = raidCardSelectedId ? speciesList.find(p=>p.id===raidCardSelectedId) : null;
  if(!species) return;

  const tier = RAID_TIERS.find(t=>t.key===raidCardTierKey);
  const img = artUrl(species.id, raidCardShiny);
  const useBoost = raidCardWeatherBoosted && raidCardCpBoostMin && raidCardCpBoostMax;
  const cpLabel = useBoost
    ? `${raidCardCpBoostMin} - ${raidCardCpBoostMax} CP`
    : (raidCardCpMin && raidCardCpMax ? `${raidCardCpMin} - ${raidCardCpMax} CP` : '');
  const weatherLabel = (raidCardWeatherBoosted && raidCardWeatherTypes.length) ? `${raidCardWeatherTypes.join(' / ')} Boosted` : '';
  const digits = trainerCode.replace(/\D/g,'');
  const formattedCode = digits ? digits.replace(/(\d{4})(?=\d)/g,'$1 ').trim() : '';

  raidCardHtml = `
    <div id="raidCard">
      <div class="tc-title">${tier ? tier.label : ''} Raid</div>
      <div class="tc-box" style="text-align:center;">
        ${raidCardShiny ? '<div class="tc-sparkle" style="top:10px;right:16px;">✦</div><div class="tc-sparkle" style="bottom:10px;left:16px;">✦</div>' : ''}
        <img src="${img}" crossorigin="anonymous" onerror="this.src='${artUrl(species.id,false)}'" style="width:140px;height:140px;object-fit:contain;">
        <div style="font-size:20px;font-weight:700;text-transform:capitalize;color:#222;margin-top:6px;">${species.name}</div>
        ${(cpLabel || weatherLabel) ? `<div style="font-size:14px;color:#555;margin-top:2px;">${cpLabel}${weatherLabel ? ` · ${weatherLabel}` : ''}</div>` : ''}
        ${raidCardShiny ? '<div class="rc-shiny-note">✦ Shiny Available</div>' : ''}
      </div>
      ${formattedCode ? `
      <div class="tc-trainer-row">
        <div class="tc-trainer-text">
          <div class="tc-trainer-label">Trainer Code</div>
          <div class="tc-trainer-code mono">${formattedCode}</div>
        </div>
      </div>` : ''}
    </div>
  `;
  renderRaidCardBuilder();
}

function downloadRaidCard(){
  const node = document.getElementById('raidCard');
  if(!node || typeof html2canvas==='undefined') return;
  html2canvas(node, {backgroundColor:null, scale:2, useCORS:true, allowTaint:false}).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'pokemon-raid-card.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

/* ---------------- BOOT ---------------- */

async function bootApp(){
  document.getElementById('app').innerHTML = '<div class="panel" style="text-align:center;padding:60px;"><div class="spinner"></div><div class="bezel-sub">Loading your Pokédex...</div></div>';
  bootError = null;
  try{
    await Promise.all([loadSpeciesList(), loadPoGoApiData(), loadRaidBossData(), loadEventsData()]);
    await loadDexData();
    render();
    if(!trainerCode) showTrainerCodePrompt();
  }catch(e){
    bootError = e;
    render();
  }
}

function showTrainerCodePrompt(){
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-hero">
      <img src="logo.png" alt="" style="width:64px;height:64px;border-radius:50%;">
      <div class="modal-name display" style="margin-top:10px;font-size:19px;">Add your Trainer Code</div>
    </div>
    <p class="bezel-sub" style="text-align:center;margin:0 0 16px;">Shown on your trade card so people know who to add. You can set or change this anytime from the Profile tab.</p>
    <input type="text" id="promptTrainerCodeInput" placeholder="1234 5678 9012" maxlength="14" style="width:100%;text-align:center;font-size:16px;margin-bottom:14px;">
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="primary-btn" style="margin-top:0;" onclick="saveTrainerCodeFromPrompt()">Save</button>
      <button class="tab-btn" onclick="closeModal()">Skip for now</button>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('promptTrainerCodeInput').oninput = (ev)=>{
    ev.target.value = formatTrainerCode(ev.target.value);
  };
}

function saveTrainerCodeFromPrompt(){
  const val = document.getElementById('promptTrainerCodeInput').value.trim();
  trainerCode = val;
  saveDexData();
  closeModal();
  if(currentTab==='profile') renderTabContent();
}

window.onload = initAuth;
</script>
</body>
