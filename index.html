<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PogoDex Tracker</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg-deep:#0A1420;
    --bg-panel:#0F1E2E;
    --bg-panel-2:#142A3D;
    --line:#20394D;
    --accent:#7C93B0;
    --accent-dim:#45566A;
    --red:#FF4B4B;
    --gold:#FFCE45;
    --text:#EAF6F0;
    --text-dim:#84A2B0;
    --good:#4ADE80;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, #17273a 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #14212e 0%, transparent 55%),
      var(--bg-deep);
    color:var(--text);
    font-family:'Roboto',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Roboto',sans-serif;font-weight:700;}
  .mono{font-family:'Roboto Mono',monospace;}
  #app{max-width:1200px;margin:0 auto;padding:20px 16px 60px;}

  .bezel{
    background:linear-gradient(160deg,var(--bg-panel),var(--bg-panel-2));
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:relative;
  }
  .bezel::before{
    content:"";
    position:absolute;inset:0;
    border-radius:20px;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2764%27%20height%3D%2764%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cpath%20fill%3D%27%23A9C2D6%27%20fill-opacity%3D%270.06%27%20d%3D%27M34%204%20L14%2034%20L26%2034%20L10%2060%20L40%2028%20L26%2028%20L38%204%20Z%27/%3E%3C/svg%3E");
    background-size:64px 64px;
    pointer-events:none;
  }
  .bezel-title{display:flex;align-items:center;gap:12px;}
  .power-dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(255,75,75,0.2);animation:pulse 2.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .brand-logo{width:64px;height:64px;border-radius:50%;flex-shrink:0;}
  .signin-logo{width:130px;height:130px;margin:0 auto 14px;display:block;}
  .bezel-title h1{margin:0;font-size:24px;letter-spacing:.3px;}
  .bezel-sub{color:var(--text-dim);font-size:13px;margin-top:2px;}
  .stat-pill{
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 16px;
    font-size:13px;
    color:var(--text-dim);
  }
  .stat-pill b{color:var(--gold);font-family:'Roboto Mono',monospace;}
  .profile-chip{display:flex;align-items:center;gap:8px;position:relative;cursor:pointer;padding:6px 10px;border-radius:10px;transition:.15s;}
  .profile-chip:hover{background:var(--bg-deep);}
  .profile-chip img{width:28px;height:28px;border-radius:50%;}
  .chip-caret{color:var(--text-dim);font-size:11px;}
  .account-menu{
    display:none;
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px;
    min-width:150px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
    z-index:20;
  }
  .account-menu.open{display:flex;flex-direction:column;gap:2px;}
  .account-menu button{
    background:none;
    border:none;
    color:var(--text);
    text-align:left;
    padding:9px 12px;
    border-radius:8px;
    font-family:'Roboto',sans-serif;
    font-size:14px;
    cursor:pointer;
  }
  .account-menu button:hover{background:var(--bg-deep);}

  .tabs{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap;}
  .tab-btn{
    background:var(--bg-panel);
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:10px 18px;
    border-radius:12px;
    font-family:'Roboto',sans-serif;font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:.15s;
  }
  .tab-btn:hover{color:var(--text);border-color:var(--accent-dim);}
  .tab-btn.active{background:var(--accent);color:var(--bg-deep);border-color:var(--accent);font-weight:700;}
  .tab-btn:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }

  .search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  input[type=text], input[type=number]{
    background:var(--bg-deep);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 14px;
    border-radius:10px;
    font-family:'Roboto',sans-serif;
    font-size:14px;
  }
  input[type=text]{flex:1;min-width:180px;}

  select{
    background:var(--bg-deep);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 14px;
    border-radius:10px;
    font-family:'Roboto',sans-serif;
    font-size:14px;
    cursor:pointer;
  }

  .dex-grid{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .dex-cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:12px;
    padding-top:10px;
  }
  .region-section{border-bottom:1px solid var(--line);padding-bottom:8px;}
  .region-section:last-child{border-bottom:none;}
  .region-toggle{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    background:none;
    border:none;
    color:var(--text);
    cursor:pointer;
    padding:10px 4px;
    font-family:'Roboto',sans-serif;
  }
  .region-toggle:hover .region-title{color:var(--accent);}
  .region-chevron{color:var(--accent);font-size:13px;width:14px;text-align:center;}
  .region-title{font-weight:700;font-size:15px;transition:.15s;}
  .region-count{color:var(--text-dim);font-size:12px;margin-left:auto;}
  .dex-card{
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;
    text-align:center;
    cursor:pointer;
    transition:.15s;
    position:relative;
  }
  .dex-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .dex-card img{width:72px;height:72px;object-fit:contain;}
  .dex-num{color:var(--text-dim);font-size:11px;}
  .dex-name{font-size:13px;font-weight:700;text-transform:capitalize;margin-top:2px;}
  .quick-toggles{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:2;}
  .qt-btn{
    width:22px;height:22px;border-radius:50%;
    border:1px solid var(--line);
    background:var(--bg-panel);
    color:var(--text-dim);
    font-size:12px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;line-height:1;
    transition:.15s;
  }
  .qt-btn:hover{border-color:var(--accent);color:var(--text);}
  .qt-btn.active{background:var(--good);border-color:var(--good);color:var(--bg-deep);}
  .qt-btn.shiny.active{background:var(--gold);border-color:var(--gold);color:var(--bg-deep);}
  .dex-card-body{cursor:pointer;}


  .overlay{position:fixed;inset:0;background:rgba(5,10,25,0.75);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .overlay.show{display:flex;}
  .modal{background:var(--bg-panel);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:22px;position:relative;}
  .modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;}
  .modal-hero{text-align:center;}
  .modal-hero img{width:150px;height:150px;object-fit:contain;}
  .modal-num{color:var(--text-dim);font-family:'Roboto Mono',monospace;}
  .modal-name{font-size:22px;text-transform:capitalize;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);}
  .toggle-row label{font-size:14px;color:var(--text-dim);}
  .switch{position:relative;width:44px;height:24px;}
  .switch input{opacity:0;width:0;height:0;}
  .slider{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:24px;transition:.15s;}
  .slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:white;border-radius:50%;transition:.15s;}
  input:checked + .slider{background:var(--accent);}
  input:checked + .slider::before{transform:translateX(20px);}
  .qty-input{width:70px;text-align:center;}
  .qty-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:14px 0;
    border-top:1px solid var(--line);
  }
  .qty-block{display:flex;flex-direction:column;gap:6px;}
  .qty-block label{font-size:12px;color:var(--text-dim);}
  .qty-block .qty-input{width:100%;text-align:left;}
  .form-qty-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-left:auto;}
  .mini-qty{display:flex;flex-direction:column;gap:2px;align-items:center;}
  .mini-qty span{font-size:10px;color:var(--text-dim);}
  .qty-input-mini{width:44px;text-align:center;padding:4px;font-size:12px;}
  .forms-section{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
  .form-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .form-item img{width:48px;height:48px;object-fit:contain;}
  .form-item .fname{flex:1;font-size:13px;text-transform:capitalize;}
  .mini-toggle{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-dim);}
  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:14px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .inv-list{display:flex;flex-direction:column;gap:8px;}
  .inv-row{display:flex;align-items:center;gap:12px;background:var(--bg-deep);border:1px solid var(--line);border-radius:10px;padding:8px 12px;}
  .inv-row img{width:44px;height:44px;object-fit:contain;}
  .inv-row .name{flex:1;text-transform:capitalize;font-size:14px;}
  .inv-row .tag{font-size:11px;color:var(--gold);background:rgba(255,206,69,0.12);padding:2px 8px;border-radius:999px;}

  .trade-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:760px){.trade-cols{grid-template-columns:1fr;} .dex-card img{width:56px;height:56px;}}
  .trade-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;margin-top:10px;}
  .trade-item{display:flex;align-items:center;gap:8px;background:var(--bg-deep);border:1px solid var(--line);border-radius:8px;padding:6px 10px;}
  .trade-item img{width:32px;height:32px;object-fit:contain;}
  .trade-item span{flex:1;font-size:13px;text-transform:capitalize;}
  .x-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;}
  .primary-btn{background:var(--accent);color:var(--bg-deep);border:none;padding:10px 20px;border-radius:10px;cursor:pointer;font-family:'Roboto',sans-serif;font-weight:700;margin-top:10px;}
  .search-results{max-height:180px;overflow-y:auto;margin-top:8px;}
  .sr-item{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;cursor:pointer;}
  .sr-item:hover{background:var(--bg-deep);}
  .sr-item img{width:28px;height:28px;object-fit:contain;}

  #tradeCardWrap{margin-top:20px;}
  #tradeCard{
    width:900px;max-width:100%;
    background:
      radial-gradient(ellipse 60% 45% at 28% 18%, rgba(255,79,163,0.38) 0%, transparent 60%),
      radial-gradient(ellipse 55% 45% at 75% 82%, rgba(216,59,171,0.28) 0%, transparent 55%),
      conic-gradient(from 200deg at 50% 45%, rgba(233,30,140,0.20) 0deg, rgba(45,17,64,0) 90deg, rgba(233,30,140,0.16) 200deg, rgba(45,17,64,0) 300deg, rgba(233,30,140,0.20) 360deg),
      linear-gradient(135deg,#33184A 0%,#1D0E30 45%,#0A0512 100%);
    border-radius:24px;padding:26px;color:white;font-family:'Roboto',sans-serif;
    position:relative;overflow:hidden;
  }
  #tradeCard::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.05) 0 3px, transparent 3px 22px),
      repeating-linear-gradient(25deg, rgba(255,79,163,0.08) 0 2px, transparent 2px 32px);
    mix-blend-mode:screen;
  }
  #tradeCard::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 8%, rgba(255,255,255,0.10) 0%, transparent 35%);
  }
  .tc-title{text-align:center;font-family:'Roboto',sans-serif;font-weight:900;font-size:30px;text-shadow:0 0 14px rgba(255,79,163,0.55), 0 2px 0 rgba(0,0,0,0.4);position:relative;margin-bottom:14px;}
  .tc-section-label{display:flex;align-items:center;gap:10px;font-family:'Roboto',sans-serif;font-weight:700;font-size:19px;margin:14px 0 8px;position:relative;text-shadow:0 1px 4px rgba(0,0,0,0.4);}
  .tc-ball{width:24px;height:24px;border-radius:50%;background:linear-gradient(#fff 50%,#eee 50%);border:2px solid #222;position:relative;}
  .tc-ball::before{content:"";position:absolute;top:9px;left:0;right:0;height:3px;background:#222;}
  .tc-ball::after{content:"";position:absolute;top:7px;left:8px;width:8px;height:8px;background:#fff;border:2px solid #222;border-radius:50%;}
  .tc-box{background:rgba(255,255,255,0.94);border-radius:16px;padding:16px;min-height:110px;position:relative;}
  .tc-grid{display:flex;flex-wrap:wrap;gap:18px;}
  .tc-mon{position:relative;width:110px;text-align:center;}
  .tc-mon img{width:96px;height:96px;object-fit:contain;}
  .tc-mon .tc-name{font-size:11px;color:#333;text-transform:capitalize;font-weight:600;}
  .tc-sparkle{position:absolute;color:#C2247E;font-size:14px;}
  .tc-empty{color:#8a8a8a;font-size:13px;padding:20px;text-align:center;width:100%;}
  .tc-trainer-row{
    margin-top:16px;
    background:rgba(255,255,255,0.94);
    border-radius:16px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .tc-trainer-label{font-size:11px;color:#8a5b8c;text-transform:uppercase;letter-spacing:.06em;font-weight:700;text-align:center;}
  .tc-trainer-code{font-size:20px;color:#9C2E7D;font-weight:600;letter-spacing:.04em;text-align:center;}

  .trainer-code-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:16px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .trainer-code-row label{font-size:13px;color:var(--text-dim);font-family:'Roboto',sans-serif;font-weight:700;}
  .trainer-code-row input{width:180px;}
  .trainer-code-input-group{display:flex;align-items:center;gap:6px;}
  .copy-btn{
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-deep);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text-dim);
    cursor:pointer;
    transition:.15s;
    flex-shrink:0;
  }
  .copy-btn:hover{border-color:var(--accent);color:var(--text);}

  .banner{background:rgba(255,75,75,0.12);border:1px solid var(--red);color:var(--text);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;}
  .retry-btn{background:var(--red);border:none;color:white;padding:6px 14px;border-radius:8px;cursor:pointer;margin-left:10px;}
  .empty-note{color:var(--text-dim);font-size:13px;padding:20px;text-align:center;}
  .signin-panel{max-width:420px;margin:80px auto;text-align:center;padding:44px 30px;}
  .signin-panel .primary-btn{padding:12px 26px;font-size:15px;}
</style>
</head>
<body>
<div id="app"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* ====== CONFIG — replace with your own Google Cloud OAuth Client ID ====== */
const GOOGLE_CLIENT_ID = '2001238896-ht3k0nndbemo7rtp232mq010mu623s5g.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email';
const DRIVE_FILE_NAME = 'pokedex-tellez-data.json';

const NATIONAL_DEX_MAX = 1025;

let speciesList = [];
let dexData = {};
let formCatalog = {};
let currentTab = 'dex';
let dexSearch = '';
let dexRegion = 'all';
let collapsedRegions = {};

const REGIONS = [
  {key:'kanto', label:'Kanto', min:1, max:151},
  {key:'johto', label:'Johto', min:152, max:251},
  {key:'hoenn', label:'Hoenn', min:252, max:386},
  {key:'sinnoh', label:'Sinnoh', min:387, max:493},
  {key:'unova', label:'Unova', min:494, max:649},
  {key:'kalos', label:'Kalos', min:650, max:721},
  {key:'alola', label:'Alola', min:722, max:809},
  {key:'galar', label:'Galar', min:810, max:905},
  {key:'paldea', label:'Paldea', min:906, max:1025}
];
function regionForId(id){
  return REGIONS.find(r=>id>=r.min && id<=r.max) || null;
}
let invFilter = '';
let bootError = null;
let modalId = null;
let modalLoadingForms = false;
let tradeWanted = [];
let tradeOfferingQty = {};
let tradeSearch = '';
let offeringFilter = '';
let tradeCardHtml = '';
let trainerCode = '';

let tokenClient = null;
let accessToken = null;
let tokenExpiryMs = 0;
let userProfile = null;
let driveFileId = null;
let saveTimer = null;

function artUrl(id, shiny){
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${shiny ? 'shiny/' : ''}${id}.png`;
}

/* ---------------- AUTH ---------------- */

function initAuth(){
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
    setTimeout(initAuth, 200);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: SCOPES,
    callback: handleTokenResponse
  });
  renderSignIn();
}

function renderSignIn(){
  document.getElementById('app').innerHTML = `
    <div class="panel signin-panel">
      <img src="logo.png" alt="PogoDex Tracker logo" class="brand-logo signin-logo">
      <h1 class="display" style="margin:0 0 8px;">PogoDex Tracker</h1>
      <p class="bezel-sub" style="margin-bottom:26px;">Sign in with Google to load your dex, inventory, and trade lists.</p>
      <button class="primary-btn" onclick="signIn()">Sign in with Google</button>
    </div>
  `;
}

function signIn(){
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

async function handleTokenResponse(resp){
  if(resp.error){
    console.error('auth error', resp);
    return;
  }
  accessToken = resp.access_token;
  tokenExpiryMs = Date.now() + (resp.expires_in * 1000);
  try{
    const uRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    userProfile = await uRes.json();
  }catch(e){ /* profile is cosmetic only */ }
  await bootApp();
}

function ensureFreshToken(){
  return new Promise((resolve, reject)=>{
    if(accessToken && Date.now() < tokenExpiryMs - 60000){ resolve(); return; }
    tokenClient.callback = (resp)=>{
      if(resp.error){ reject(resp); return; }
      accessToken = resp.access_token;
      tokenExpiryMs = Date.now() + (resp.expires_in * 1000);
      resolve();
    };
    tokenClient.requestAccessToken({ prompt: '' });
  });
}

function signOut(){
  if(accessToken){
    try{ google.accounts.oauth2.revoke(accessToken, ()=>{}); }catch(e){}
  }
  accessToken = null;
  tokenExpiryMs = 0;
  userProfile = null;
  driveFileId = null;
  dexData = {};
  renderSignIn();
}

/* ---------------- DRIVE STORAGE ---------------- */

async function driveEnsureFile(){
  if(driveFileId) return driveFileId;
  await ensureFreshToken();
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: `Bearer ${accessToken}` }
  });
  const json = await res.json();
  if(json.files && json.files.length){
    driveFileId = json.files[0].id;
    return driveFileId;
  }
  const boundary = 'pokedexboundary';
  const metadata = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({ dexData: {} })}\r\n` +
    `--${boundary}--`;
  const createRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: {
      Authorization: `Bearer ${accessToken}`,
      'Content-Type': `multipart/related; boundary=${boundary}`
    },
    body
  });
  const createJson = await createRes.json();
  driveFileId = createJson.id;
  return driveFileId;
}

async function loadDexData(){
  try{
    const fileId = await driveEnsureFile();
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
      headers: { Authorization: `Bearer ${accessToken}` }
    });
    if(res.ok){
      const json = await res.json();
      dexData = json.dexData || {};
      trainerCode = (json.profile && json.profile.trainerCode) || '';
    } else {
      dexData = {};
    }
  }catch(e){
    console.error('Drive load failed', e);
    dexData = {};
  }
  migrateAllDexData();
}

function migrateAllDexData(){
  Object.keys(dexData).forEach(idStr=>{
    const e = dexData[idStr];
    if(e.ownedNormal === undefined) migrateLegacyEntry(e);
    if(!e.forms) e.forms = {};
    Object.keys(e.forms).forEach(fname=>{
      const fe = e.forms[fname];
      if(fe.ownedNormal === undefined) migrateLegacyEntry(fe);
    });
  });
}

function saveDexData(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      const fileId = await driveEnsureFile();
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: {
          Authorization: `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ dexData, profile: { trainerCode } })
      });
    }catch(e){
      console.error('Drive save failed', e);
    }
  }, 1200);
}

/* ---------------- SPECIES / FORM CACHE (local, not user data) ---------------- */

async function loadSpeciesList(){
  try{
    const cached = localStorage.getItem('pokedex-species-list');
    if(cached){ speciesList = JSON.parse(cached); return; }
  }catch(e){}
  const res = await fetch('https://pokeapi.co/api/v2/pokemon-species?limit=1302');
  if(!res.ok) throw new Error('species fetch failed');
  const json = await res.json();
  speciesList = json.results.map(r=>{
    const parts = r.url.split('/').filter(Boolean);
    const id = parseInt(parts[parts.length-1]);
    return {id, name:r.name};
  }).filter(p=>p.id<=NATIONAL_DEX_MAX).sort((a,b)=>a.id-b.id);
  try{ localStorage.setItem('pokedex-species-list', JSON.stringify(speciesList)); }catch(e){}
}

function migrateLegacyEntry(e){
  // Converts the old {caught,shiny,tradeQty} boolean model into the new
  // quantity-based model: ownedNormal/ownedShiny + tradeNormal/tradeShiny.
  const wasCaught = !!e.caught;
  const wasShiny = !!e.shiny;
  const oldQty = e.tradeQty || 0;
  e.ownedNormal = (wasCaught && !wasShiny) ? 1 : 0;
  e.ownedShiny = (wasCaught && wasShiny) ? 1 : 0;
  e.tradeNormal = (wasCaught && !wasShiny) ? Math.min(oldQty, e.ownedNormal) : 0;
  e.tradeShiny = (wasCaught && wasShiny) ? Math.min(oldQty, e.ownedShiny) : 0;
  delete e.caught;
  delete e.shiny;
  delete e.tradeQty;
}

function getEntry(id){
  if(!dexData[id]) dexData[id] = {ownedNormal:0, ownedShiny:0, tradeNormal:0, tradeShiny:0, forms:{}};
  const e = dexData[id];
  if(e.ownedNormal === undefined) migrateLegacyEntry(e);
  if(!e.forms) e.forms = {};
  return e;
}
function getFormEntry(id, formName){
  const e = getEntry(id);
  if(!e.forms[formName]) e.forms[formName] = {ownedNormal:0, ownedShiny:0, tradeNormal:0, tradeShiny:0};
  const fe = e.forms[formName];
  if(fe.ownedNormal === undefined) migrateLegacyEntry(fe);
  return fe;
}

async function loadForms(id){
  if(formCatalog[id]) return formCatalog[id];
  try{
    const cached = localStorage.getItem('pokedex-forms-v2-'+id);
    if(cached){ formCatalog[id] = JSON.parse(cached); return formCatalog[id]; }
  }catch(e){}
  try{
    const sRes = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}/`);
    const species = await sRes.json();
    const varieties = (species.varieties||[]).filter(v=>!v.is_default);
    const forms = [];
    for(const v of varieties){
      try{
        const pRes = await fetch(v.pokemon.url);
        const p = await pRes.json();
        const art = p.sprites && p.sprites.other && p.sprites.other['official-artwork'];
        const reg = p.sprites || {};
        // PokeAPI's official-artwork field is frequently null for regional/alternate
        // form varieties (a known gap in their sprite data), so fall back to the
        // variety's regular sprite before falling back to the base species artwork.
        forms.push({
          name: v.pokemon.name,
          displayName: v.pokemon.name.replace(`${species.name}-`,'').replace(/-/g,' ') || v.pokemon.name,
          sprite: (art && art.front_default) || reg.front_default || artUrl(id,false),
          shinySprite: (art && art.front_shiny) || reg.front_shiny || artUrl(id,true)
        });
      }catch(e){}
    }
    formCatalog[id] = forms;
    try{ localStorage.setItem('pokedex-forms-v2-'+id, JSON.stringify(forms)); }catch(e){}
    return forms;
  }catch(e){
    formCatalog[id] = [];
    return [];
  }
}

function statCaughtCount(){

}

function formatTrainerCode(raw){
  const digits = raw.replace(/\D/g,'').slice(0,12);
  return digits.replace(/(\d{4})(?=\d)/g,'$1 ').trim();
}

function copyTrainerCode(){
  const input = document.getElementById('trainerCodeInput');

function filterDexList(){
  return speciesList.filter(p=>{

    }
    if(dexRegion !== 'all'){
      const r = regionForId(p.id);
      if(!r || r.key !== dexRegion) return false;
    }
    return true;
  });
}

function isRegionCollapsed(key){
  return collapsedRegions[key] !== false;
}

function toggleRegion(key){
  collapsedRegions[key] = !isRegionCollapsed(key);
  renderDexSections(filterDexList());
}

function renderCardsHtml(items){
  if(!items.length) return '<div class="empty-note">No Pokémon match that search.</div>';
  return `<div class="dex-cards-grid">${items.map(p=>{
    const e = dexData[p.id];
    const caught = e && (e.ownedNormal>0 || e.ownedShiny>0);
    const shiny = e && e.ownedShiny>0;
    return `
      <div class="dex-card">
        <div class="quick-toggles">
          <button class="qt-btn ${caught?'active':''}" title="Mark caught" onclick="event.stopPropagation(); quickToggleCaught(${p.id})">✓</button>
          <button class="qt-btn shiny ${shiny?'active':''}" title="Mark shiny" onclick="event.stopPropagation(); quickToggleShiny(${p.id})">★</button>
        </div>

          <img src="${artUrl(p.id,shiny)}" loading="lazy" alt="${p.name}" onerror="this.src='${artUrl(p.id,false)}'">
          <div class="dex-num mono">#${String(p.id).padStart(4,'0')}</div>
          <div class="dex-name">${p.name}</div>
        </div>
      </div>
    `;
  }).join('')}</div>`;
}

function renderDexSections(filtered){
  const grid = document.getElementById('dexGrid');
  if(!grid) return;
  const grouped = !dexSearch && dexRegion === 'all';
  if(!grouped){
    grid.innerHTML = renderCardsHtml(filtered);
    return;
  }
  let html = '';
  REGIONS.forEach(r=>{
    const items = filtered.filter(p=>p.id>=r.min && p.id<=r.max);
    if(!items.length) return;
    const collapsed = isRegionCollapsed(r.key);
    const caughtCount = items.filter(p=>{
      const e = dexData[p.id];
      return e && (e.ownedNormal>0 || e.ownedShiny>0);
    }).length;
    html += `
      <div class="region-section">
        <button class="region-toggle" onclick="toggleRegion('${r.key}')">
          <span class="region-chevron">${collapsed ? '▸' : '▾'}</span>
          <span class="region-title">${r.label}</span>
          <span class="region-count mono">${caughtCount}/${items.length} caught</span>
        </button>
        ${collapsed ? '' : renderCardsHtml(items)}
      </div>
    `;
  });
  grid.innerHTML = html || '<div class="empty-note">No Pokémon match that search.</div>';
}

function refreshDexGridIfVisible(){

function quickToggleCaught(id){
  // Quick shortcut on the grid card: toggles a single normal-owned copy on/off.
  // For managing exact quantities beyond 1, use the detail modal.
  const e = getEntry(id);
  if(e.ownedNormal > 0){
    e.ownedNormal = 0;
    e.tradeNormal = 0;
  } else {
    e.ownedNormal = 1;
  }
  saveDexData();
  refreshDexGridIfVisible();
}

function quickToggleShiny(id){
  const e = getEntry(id);
  if(e.ownedShiny > 0){
    e.ownedShiny = 0;
    e.tradeShiny = 0;
  } else {
    e.ownedShiny = 1;
  }
  saveDexData();
  refreshDexGridIfVisible();
}

          <div class="mini-qty"><span>Shiny</span><input type="number" min="0" class="qty-input-mini" value="${fe.ownedShiny}" onchange="setFormOwned(${id}, '${f.name}', 'shiny', this.value)"></div>
          <div class="mini-qty"><span>Trade N</span><input type="number" min="0" max="${fe.ownedNormal}" class="qty-input-mini" value="${fe.tradeNormal}" ${fe.ownedNormal?'':'disabled'} onchange="setFormTradeAvail(${id}, '${f.name}', 'normal', this.value)"></div>
          <div class="mini-qty"><span>Trade S</span><input type="number" min="0" max="${fe.ownedShiny}" class="qty-input-mini" value="${fe.tradeShiny}" ${fe.ownedShiny?'':'disabled'} onchange="setFormTradeAvail(${id}, '${f.name}', 'shiny', this.value)"></div>

function closeModal(){
  document.getElementById('overlay').classList.remove('show');

function setOwned(id, variant, val){
  const e = getEntry(id);
  const qty = Math.max(0, parseInt(val)||0);
  if(variant === 'shiny'){
    e.ownedShiny = qty;
    if(e.tradeShiny > qty) e.tradeShiny = qty;
  } else {
    e.ownedNormal = qty;
    if(e.tradeNormal > qty) e.tradeNormal = qty;
  }
  saveDexData();
  const species = speciesList.find(p=>p.id===id);
  renderModal(species, formCatalog[id]);
  render();
}

function setTradeAvail(id, variant, val){
  const e = getEntry(id);
  const owned = variant === 'shiny' ? e.ownedShiny : e.ownedNormal;
  const qty = Math.max(0, Math.min(owned, parseInt(val)||0));
  if(variant === 'shiny') e.tradeShiny = qty; else e.tradeNormal = qty;
  saveDexData();
  const species = speciesList.find(p=>p.id===id);
  renderModal(species, formCatalog[id]);
}

function setFormOwned(id, formName, variant, val){
  const fe = getFormEntry(id, formName);
  const qty = Math.max(0, parseInt(val)||0);
  if(variant === 'shiny'){
    fe.ownedShiny = qty;
    if(fe.tradeShiny > qty) fe.tradeShiny = qty;
  } else {
    fe.ownedNormal = qty;
    if(fe.tradeNormal > qty) fe.tradeNormal = qty;
  }
  saveDexData();
  const species = speciesList.find(p=>p.id===id);
  renderModal(species, formCatalog[id]);
}

function setFormTradeAvail(id, formName, variant, val){
  const fe = getFormEntry(id, formName);
  const owned = variant === 'shiny' ? fe.ownedShiny : fe.ownedNormal;
  const qty = Math.max(0, Math.min(owned, parseInt(val)||0));
  if(variant === 'shiny') fe.tradeShiny = qty; else fe.tradeNormal = qty;
  saveDexData();
  const species = speciesList.find(p=>p.id===id);
  renderModal(species, formCatalog[id]);
}

function buildOwnedRows(){
  const rows = [];
  Object.keys(dexData).forEach(idStr=>{
    const id = parseInt(idStr);
    const e = getEntry(id);
    const species = speciesList.find(p=>p.id===id);
    if(!species) return;
    if(e.ownedNormal > 0) rows.push({id, form:null, variant:'normal', name:species.name, count:e.ownedNormal, tradeAvail:e.tradeNormal});
    if(e.ownedShiny > 0) rows.push({id, form:null, variant:'shiny', name:species.name, count:e.ownedShiny, tradeAvail:e.tradeShiny});
    Object.keys(e.forms||{}).forEach(fname=>{
      const fe = getFormEntry(id, fname);
      const cat = (formCatalog[id]||[]).find(f=>f.name===fname);
      const label = cat ? `${cat.displayName} ${species.name}` : fname;
      if(fe.ownedNormal > 0) rows.push({id, form:fname, variant:'normal', name:label, count:fe.ownedNormal, tradeAvail:fe.tradeNormal});
      if(fe.ownedShiny > 0) rows.push({id, form:fname, variant:'shiny', name:label, count:fe.ownedShiny, tradeAvail:fe.tradeShiny});
    });
  });
  return rows;
}

function rowSprite(r){
  if(r.form){
    const cat = (formCatalog[r.id]||[]).find(f=>f.name===r.form);
    return cat ? (r.variant==='shiny' ? cat.shinySprite : cat.sprite) : null;
  }
  return artUrl(r.id, r.variant==='shiny');
}

  `;
  document.getElementById('invSearchInput').oninput = (ev)=>{ invFilter = ev.target.value; renderTabContent(); };
}

function removeFromInventory(id, variant){
  const e = getEntry(id);
  if(variant === 'shiny'){ e.ownedShiny = 0; e.tradeShiny = 0; }
  else { e.ownedNormal = 0; e.tradeNormal = 0; }
  saveDexData();
  renderTabContent();
}

function removeFormFromInventory(id, formName, variant){
  const fe = getFormEntry(id, formName);
  if(variant === 'shiny'){ fe.ownedShiny = 0; fe.tradeShiny = 0; }
  else { fe.ownedNormal = 0; fe.tradeNormal = 0; }
  saveDexData();
  renderTabContent();
}

const SHEETS_API = 'https://sheets.googleapis.com/v4/spreadsheets';

function buildInventoryExportRows(){
  return buildOwnedRows().map(r=>{
    const sprite = rowSprite(r) || artUrl(r.id, r.variant==='shiny');
    return [
      `=IMAGE("${sprite}")`,
      r.id,
      r.name,
      r.variant==='shiny' ? 'Yes' : 'No',
      r.count,
      r.tradeAvail
    ];
  });
}

async function exportInventoryToSheets(){
  const btn = document.getElementById('exportSheetsBtn');
  const rows = buildInventoryExportRows();
  if(!rows.length){
    alert('Nothing to export yet — mark some Pokémon as caught first.');
    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = 'Exporting…'; }
  try{
    await ensureFreshToken();

    const title = `PogoDex Inventory Export — ${new Date().toLocaleDateString()}`;
    const createRes = await fetch(SHEETS_API, {
      method: 'POST',
      headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ properties: { title } })
    });
    if(!createRes.ok) throw new Error('Failed to create spreadsheet');
    const created = await createRes.json();
    const spreadsheetId = created.spreadsheetId;

    const header = ['Image', 'Dex #', 'Name', 'Shiny', 'Owned Qty', 'Trade Available Qty'];
    const values = [header, ...rows];
    const range = encodeURIComponent('Sheet1!A1');
    const writeRes = await fetch(`${SHEETS_API}/${spreadsheetId}/values/${range}?valueInputOption=USER_ENTERED`, {
      method: 'PUT',
      headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ values })
    });
    if(!writeRes.ok) throw new Error('Failed to write values');

    await fetch(`${SHEETS_API}/${spreadsheetId}:batchUpdate`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        requests: [
          { updateDimensionProperties: { range: { sheetId: 0, dimension: 'COLUMNS', startIndex: 0, endIndex: 1 }, properties: { pixelSize: 90 }, fields: 'pixelSize' } },
          { updateDimensionProperties: { range: { sheetId: 0, dimension: 'ROWS', startIndex: 1, endIndex: values.length }, properties: { pixelSize: 80 }, fields: 'pixelSize' } },
          { repeatCell: { range: { sheetId: 0, startRowIndex: 0, endRowIndex: 1 }, cell: { userEnteredFormat: { textFormat: { bold: true } } }, fields: 'userEnteredFormat.textFormat.bold' } }
        ]
      })
    });

    const url = created.spreadsheetUrl || `https://docs.google.com/spreadsheets/d/${spreadsheetId}/edit`;
    window.open(url, '_blank');
  }catch(e){
    console.error('Sheets export failed', e);
    alert('Export failed. Check your connection and try again.');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Export to Google Sheets'; }
  }
}

function renderTrade(el){
  const results = tradeSearch ? speciesList.filter(p=>{
    const q = tradeSearch.toLowerCase();
    return p.name.includes(q) || String(p.id)===q;
  }).slice(0,20) : [];

  el.innerHTML = `
    <div class="panel">
      <div class="trade-cols">
        <div>
          <h3 class="display" style="margin-top:0;">Wanted</h3>
          <input type="text" id="tradeSearchInput" placeholder="Search Pokémon to add..." value="${tradeSearch}">
          <div class="search-results" id="tradeSearchResults">${results.map(p=>`
            <div class="sr-item" onclick="addWanted(${p.id})">
              <img src="${artUrl(p.id,false)}">
              <span style="text-transform:capitalize;font-size:13px;">${p.name}</span>
            </div>
          `).join('')}</div>
          <div class="trade-list">${tradeWanted.map((w,i)=>`
            <div class="trade-item">
              <img src="${artUrl(w.id, w.shiny)}" onerror="this.src='${artUrl(w.id,false)}'">
              <span>${w.name}</span>
              <label class="mini-toggle"><input type="checkbox" ${w.shiny?'checked':''} onchange="toggleWantedShiny(${i})"> shiny</label>
              <button class="x-btn" onclick="removeWanted(${i})">✕</button>
            </div>
          `).join('') || '<div class="empty-note">No Pokémon added yet.</div>'}</div>
        </div>
        <div>
          <h3 class="display" style="margin-top:0;">Offering (from your inventory)</h3>
          <input type="text" id="offeringFilterInput" placeholder="Filter your inventory..." value="${offeringFilter}">
          <div class="trade-list" id="offeringList" style="max-height:340px;margin-top:10px;"></div>
        </div>
      </div>
      <button class="primary-btn" onclick="generateTradeCard()">Generate Trade Card</button>
      <div id="tradeCardWrap"></div>
    </div>
  `;
  updateOfferingList();
  document.getElementById('tradeSearchInput').oninput = (ev)=>{
    tradeSearch = ev.target.value;
    updateTradeSearchResults();
  };
  document.getElementById('offeringFilterInput').oninput = (ev)=>{
    offeringFilter = ev.target.value;
    updateOfferingList();
  };

  if(tradeCardHtml){
    document.getElementById('tradeCardWrap').innerHTML = tradeCardHtml + `
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="primary-btn" onclick="downloadTradeCard()">Download Image</button>
        <button class="primary-btn" style="background:var(--red);color:white;" onclick="confirmTradeCompleted()">Confirm Trade Completed</button>
      </div>
    `;
  }
}

function updateOfferingList(){
  const listEl = document.getElementById('offeringList');
  if(!listEl) return;
  const rows = buildOwnedRows().filter(r=>r.tradeAvail > 0);
  const filtered = offeringFilter ? rows.filter(r=>r.name.toLowerCase().includes(offeringFilter.toLowerCase())) : rows;
  listEl.innerHTML = filtered.length ? filtered.map(r=>{
    const key = `${r.id}:${r.form||''}:${r.variant}`;
    const qty = tradeOfferingQty[key] || 0;
    return `
    <div class="trade-item">
      <img src="${rowSprite(r) || artUrl(r.id,false)}" onerror="this.src='${artUrl(r.id,false)}'">
      <span>${r.name}${r.variant==='shiny'?' ★':''} <span class="bezel-sub" style="margin:0;">(${r.tradeAvail} available)</span></span>
      <input type="number" class="qty-input-mini" min="0" max="${r.tradeAvail}" value="${qty}" onchange="setOfferingQty('${key}', this.value, ${r.tradeAvail})">
    </div>
  `;}).join('') : `<div class="empty-note">${buildOwnedRows().length ? 'Nothing marked as available to trade yet. Set a "Trade Available" quantity from the Pokédex tab.' : 'Mark Pokémon as caught in the Pokédex tab to offer them.'}</div>`;
}

function setOfferingQty(key, val, max){
  const qty = Math.max(0, Math.min(max, parseInt(val)||0));
  if(qty > 0) tradeOfferingQty[key] = qty; else delete tradeOfferingQty[key];
}

function updateTradeSearchResults(){
  const resultsEl = document.getElementById('tradeSearchResults');
  if(!resultsEl) return;
  const results = tradeSearch ? speciesList.filter(p=>{
    const q = tradeSearch.toLowerCase();
    return p.name.includes(q) || String(p.id)===q;
  }).slice(0,20) : [];
  resultsEl.innerHTML = results.map(p=>`
    <div class="sr-item" onclick="addWanted(${p.id})">
      <img src="${artUrl(p.id,false)}">
      <span style="text-transform:capitalize;font-size:13px;">${p.name}</span>
    </div>
  `).join('');
}

function addWanted(id){
  const species = speciesList.find(p=>p.id===id);
  if(!species) return;
  if(tradeWanted.find(w=>w.id===id)) return;
  tradeWanted.push({id, name:species.name, shiny:false});
  tradeSearch = '';
  renderTabContent();
}
function removeWanted(i){ tradeWanted.splice(i,1); renderTabContent(); }
function toggleWantedShiny(i){ tradeWanted[i].shiny = !tradeWanted[i].shiny; renderTabContent(); }

function generateTradeCard(){
  const offeringData = [];
  Object.keys(tradeOfferingQty).forEach(key=>{
    const qty = tradeOfferingQty[key];
    if(!qty) return;
    const [idStr, formName, variant] = key.split(':');
    const id = parseInt(idStr);
    const species = speciesList.find(p=>p.id===id);
    if(!species) return;
    const shiny = variant === 'shiny';
    let name, sprite;
    if(formName){
      const cat = (formCatalog[id]||[]).find(f=>f.name===formName);
      name = cat ? `${cat.displayName} ${species.name}` : formName;
      sprite = cat ? (shiny ? cat.shinySprite : cat.sprite) : artUrl(id, shiny);
    } else {
      name = species.name;
      sprite = artUrl(id, shiny);
    }
    offeringData.push({ name: qty>1 ? `${name} ×${qty}` : name, shiny, sprite, key, qty });
  });

  const wantedBoxes = tradeWanted.map(w=>`
    <div class="tc-mon">
      ${w.shiny ? '<div class="tc-sparkle" style="top:0;right:6px;">✦</div><div class="tc-sparkle" style="bottom:20px;left:2px;">✦</div>' : ''}
      <img src="${artUrl(w.id, w.shiny)}" crossorigin="anonymous" onerror="this.src='${artUrl(w.id,false)}'">
      <div class="tc-name">${w.name}</div>
    </div>
  `).join('');

  const offerBoxes = offeringData.map(o=>`
    <div class="tc-mon">
      ${o.shiny ? '<div class="tc-sparkle" style="top:0;right:6px;">✦</div><div class="tc-sparkle" style="bottom:20px;left:2px;">✦</div>' : ''}
      <img src="${o.sprite}" crossorigin="anonymous">
      <div class="tc-name">${o.name}</div>
    </div>
  `).join('');

  const digits = trainerCode.replace(/\D/g,'');
  const formattedCode = digits ? digits.replace(/(\d{4})(?=\d)/g,'$1 ').trim() : '';

  tradeCardHtml = `
    <div id="tradeCard">
      <div class="tc-title">Pokémon Trade List</div>
      <div class="tc-section-label"><div class="tc-ball"></div> Wanted Pokémon</div>
      <div class="tc-box"><div class="tc-grid">${wantedBoxes || '<div class="tc-empty">Nothing added yet</div>'}</div></div>
      <div class="tc-section-label"><div class="tc-ball"></div> Pokémon I can offer</div>
      <div class="tc-box"><div class="tc-grid">${offerBoxes || '<div class="tc-empty">Nothing selected yet</div>'}</div></div>
      ${formattedCode ? `
      <div class="tc-trainer-row">
        <div class="tc-trainer-text">
          <div class="tc-trainer-label">Trainer Code</div>
          <div class="tc-trainer-code mono">${formattedCode}</div>
        </div>
      </div>` : ''}
    </div>
  `;
  renderTabContent();
}

function confirmTradeCompleted(){
  const keys = Object.keys(tradeOfferingQty).filter(k=>tradeOfferingQty[k]>0);
  if(!keys.length){
    alert('Nothing has a quantity selected to confirm.');
    return;
  }
  keys.forEach(key=>{
    const qty = tradeOfferingQty[key];
    const [idStr, formName, variant] = key.split(':');
    const id = parseInt(idStr);
    const target = formName ? getFormEntry(id, formName) : getEntry(id);
    if(variant === 'shiny'){
      target.ownedShiny = Math.max(0, target.ownedShiny - qty);
      target.tradeShiny = Math.max(0, Math.min(target.tradeShiny, target.ownedShiny));
    } else {
      target.ownedNormal = Math.max(0, target.ownedNormal - qty);
      target.tradeNormal = Math.max(0, Math.min(target.tradeNormal, target.ownedNormal));
    }
  });
  tradeOfferingQty = {};
  tradeCardHtml = '';
  saveDexData();
  renderTabContent();
  alert('Trade recorded — your inventory has been updated.');
}

function downloadTradeCard(){
  const node = document.getElementById('tradeCard');
  if(!node || typeof html2canvas==='undefined') return;
  html2canvas(node, {backgroundColor:null, scale:2, useCORS:true, allowTaint:false}).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'pokemon-trade-list.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

async function bootApp(){
  document.getElementById('app').innerHTML = '<div class="panel" style="text-align:center;padding:60px;"><div class="spinner"></div><div class="bezel-sub">Loading your Pokédex...</div></div>';
  bootError = null;
  try{
    await loadSpeciesList();
    await loadDexData();
    render();
    if(!trainerCode) showTrainerCodePrompt();
  }catch(e){
    bootError = e;
    render();
  }
}

function showTrainerCodePrompt(){
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-hero">
      <img src="logo.png" alt="" style="width:64px;height:64px;border-radius:50%;">
      <div class="modal-name display" style="margin-top:10px;font-size:19px;">Add your Trainer Code</div>
    </div>
    <p class="bezel-sub" style="text-align:center;margin:0 0 16px;">Shown on your trade card so people know who to add. You can set or change this anytime from the Profile tab.</p>
    <input type="text" id="promptTrainerCodeInput" placeholder="1234 5678 9012" maxlength="14" style="width:100%;text-align:center;font-size:16px;margin-bottom:14px;">
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="primary-btn" style="margin-top:0;" onclick="saveTrainerCodeFromPrompt()">Save</button>

function saveTrainerCodeFromPrompt(){
  const val = document.getElementById('promptTrainerCodeInput').value.trim();
  trainerCode = val;
  saveDexData();
  closeModal();
  if(currentTab==='profile') renderTabContent();
}
